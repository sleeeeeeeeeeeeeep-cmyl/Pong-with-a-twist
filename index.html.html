<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PONG</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: "Courier New", monospace; color: #fff;
  }
  #wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; background: #000; }

  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.88);
    text-align: center; user-select: none;
  }
  .hidden { display: none; }

  h1 {
    font-size: clamp(48px, 11vw, 120px);
    letter-spacing: 0.12em; margin: 0 0 6vh; font-weight: 900;
  }
  .group { margin: 1.4vh 0; }
  .label { font-size: 13px; letter-spacing: 0.3em; opacity: 0.55; margin-bottom: 10px; }
  .buttons { display: flex; gap: 14px; justify-content: center; }

  button {
    font-family: inherit; font-weight: 700; letter-spacing: 0.15em;
    background: #000; color: #fff; border: 2px solid #fff;
    padding: 11px 20px; cursor: pointer; font-size: 14px;
    transition: background 0.1s, color 0.1s;
  }
  button:hover { background: #1c1c1c; }
  .opt.active { background: #fff; color: #000; }

  #startBtn { margin-top: 5vh; font-size: 20px; padding: 16px 52px; }
  #startBtn:hover, #playAgain:hover { background: #fff; color: #000; }
  #playAgain { margin-top: 4vh; font-size: 17px; padding: 14px 40px; }

  .hint { font-size: 12px; opacity: 0.45; margin-top: 8px; letter-spacing: 0.08em; }
  .controls { font-size: 12px; opacity: 0.5; margin-top: 6vh; letter-spacing: 0.1em; }
  #winText { font-size: clamp(32px, 7vw, 64px); letter-spacing: 0.18em; font-weight: 900; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="board"></canvas>

  <div id="menu" class="overlay">
    <h1>PONG</h1>
    <div class="group">
      <div class="label">PLAYERS</div>
      <div class="buttons">
        <button class="opt" data-group="players" data-value="1">1 PLAYER</button>
        <button class="opt active" data-group="players" data-value="2">2 PLAYERS</button>
      </div>
    </div>
    <div class="group">
      <div class="label">BALL MODE</div>
      <div class="buttons">
        <button class="opt active" data-group="ball" data-value="classic">CLASSIC</button>
        <button class="opt" data-group="ball" data-value="chaos">CHAOS</button>
      </div>
      <div class="hint">CHAOS: ball snaps to a random heading every 0.1–3s</div>
    </div>
    <button id="startBtn">START</button>
    <div class="controls">P1: W / S &nbsp;·&nbsp; P2: ↑ / ↓ &nbsp;·&nbsp; P: PAUSE &nbsp;·&nbsp; ESC: MENU</div>
  </div>

  <div id="gameover" class="overlay hidden">
    <div id="winText">LEFT WINS</div>
    <button id="playAgain">PLAY AGAIN</button>
  </div>
</div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

// --- Responsive dimensions & scaled tunables ---
let W, H, scale;
let PADDLE_W, PADDLE_H, PADDLE_MARGIN, BALL_SIZE;
let PADDLE_SPEED, CPU_SPEED, BASE_SPEED, CHAOS_SPEED, SPEED_INC, SPEED_RAMP, MAX_SPEED;

const WIN_SCORE = 11;
const MAX_BOUNCE = 0.95;   // rad, max deflection off paddle
const SERVE_DELAY = 0.7;   // s ball waits at center before launch

const left  = { x: 0, y: 0, score: 0 };
const right = { x: 0, y: 0, score: 0 };
const ball  = { x: 0, y: 0, vx: 0, vy: 0, speed: 0, serveTimer: 0, chaosTimer: 0 };

let config = { players: 2, ball: 'classic' };
let state = 'menu';   // 'menu' | 'playing' | 'over'
let paused = false;
const keys = {};

function setupDimensions(initial) {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  scale = H / 600;                                   // gameplay speeds scale with screen
  PADDLE_H = Math.round(H * 0.16);
  PADDLE_W = Math.max(10, Math.round(Math.min(W, H) * 0.016));
  BALL_SIZE = PADDLE_W;
  PADDLE_MARGIN = Math.round(W * 0.035);

  PADDLE_SPEED = 580 * scale;
  CPU_SPEED    = 430 * scale;
  BASE_SPEED   = 380 * scale;
  CHAOS_SPEED  = 360 * scale;
  SPEED_INC    = 28  * scale;   // bump per paddle hit (classic)
  SPEED_RAMP   = 26  * scale;   // gradual speed gain per second
  MAX_SPEED    = 820 * scale;

  left.x  = PADDLE_MARGIN;
  right.x = W - PADDLE_MARGIN - PADDLE_W;

  if (initial) { left.y = right.y = H/2 - PADDLE_H/2; }
  clampPaddle(left); clampPaddle(right);
  if (ball.y > H - BALL_SIZE) ball.y = H - BALL_SIZE;
}
window.addEventListener('resize', () => setupDimensions(false));

// --- Audio (retro beeps) ---
let actx = null;
function beep(freq, dur, type = 'square') {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.06, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}

// --- Menu ---
document.querySelectorAll('.opt').forEach(btn => {
  btn.addEventListener('click', () => {
    const grp = btn.dataset.group;
    document.querySelectorAll(`.opt[data-group="${grp}"]`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});
function readConfig() {
  config.players = parseInt(document.querySelector('.opt[data-group="players"].active').dataset.value, 10);
  config.ball = document.querySelector('.opt[data-group="ball"].active').dataset.value;
}
document.getElementById('startBtn').addEventListener('click', () => {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  readConfig(); startGame();
});
document.getElementById('playAgain').addEventListener('click', startGame);

function startGame() {
  left.score = 0; right.score = 0;
  left.y = right.y = H/2 - PADDLE_H/2;
  paused = false; state = 'playing';
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('gameover').classList.add('hidden');
  resetBall(Math.random() < 0.5 ? -1 : 1);
}
function toMenu() {
  state = 'menu';
  document.getElementById('menu').classList.remove('hidden');
  document.getElementById('gameover').classList.add('hidden');
}

// --- Ball serve / chaos ---
function resetBall(dir) {
  ball.x = W/2 - BALL_SIZE/2;
  ball.y = H/2 - BALL_SIZE/2;
  ball.serveTimer = SERVE_DELAY;
  if (config.ball === 'chaos') {
    ball.speed = CHAOS_SPEED;
    const a = Math.random() * Math.PI * 2;
    ball.vx = Math.cos(a) * ball.speed;
    ball.vy = Math.sin(a) * ball.speed;
    resetChaosTimer();
  } else {
    ball.speed = BASE_SPEED;
    const a = (Math.random() * 0.7) - 0.35;
    ball.vx = dir * Math.cos(a) * ball.speed;
    ball.vy = Math.sin(a) * ball.speed;
  }
}
function resetChaosTimer() { ball.chaosTimer = 0.1 + Math.random() * 2.9; }

// --- Input ---
window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (state === 'playing') {
    if (e.key === 'p' || e.key === 'P' || e.key === ' ') paused = !paused;
    if (e.key === 'Escape') toMenu();
  }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// --- Update ---
function clampPaddle(p) {
  if (p.y < 0) p.y = 0;
  if (p.y > H - PADDLE_H) p.y = H - PADDLE_H;
}
function updatePaddles(dt) {
  if (keys['w']) left.y -= PADDLE_SPEED * dt;
  if (keys['s']) left.y += PADDLE_SPEED * dt;
  clampPaddle(left);

  if (config.players === 2) {
    if (keys['arrowup'])   right.y -= PADDLE_SPEED * dt;
    if (keys['arrowdown']) right.y += PADDLE_SPEED * dt;
  } else {
    const target = ball.y + BALL_SIZE/2;
    const center = right.y + PADDLE_H/2;
    const diff = target - center;
    if (Math.abs(diff) > 14) right.y += Math.sign(diff) * CPU_SPEED * dt;
  }
  clampPaddle(right);
}
function hitsPaddle(p) {
  return ball.x < p.x + PADDLE_W && ball.x + BALL_SIZE > p.x &&
         ball.y < p.y + PADDLE_H && ball.y + BALL_SIZE > p.y;
}
function bounceOffPaddle(p, goingRight) {
  const rel = ((ball.y + BALL_SIZE/2) - (p.y + PADDLE_H/2)) / (PADDLE_H/2); // -1..1
  const angle = rel * MAX_BOUNCE;
  if (config.ball === 'classic') ball.speed = Math.min(ball.speed + SPEED_INC, MAX_SPEED);
  ball.vx = (goingRight ? 1 : -1) * Math.cos(angle) * ball.speed;
  ball.vy = Math.sin(angle) * ball.speed;
  ball.x = goingRight ? p.x + PADDLE_W : p.x - BALL_SIZE;
  beep(440, 0.05);
}
function score(side) {
  if (side === 'left') left.score++; else right.score++;
  beep(150, 0.25, 'sawtooth');
  if (left.score >= WIN_SCORE || right.score >= WIN_SCORE) {
    state = 'over';
    document.getElementById('winText').textContent =
      (left.score >= WIN_SCORE ? 'LEFT WINS' : 'RIGHT WINS');
    document.getElementById('gameover').classList.remove('hidden');
  } else {
    resetBall(side === 'left' ? -1 : 1);
  }
}
function updateBall(dt) {
  if (ball.serveTimer > 0) { ball.serveTimer -= dt; return; }

  // gradual speed-up across the rally (both modes)
  ball.speed = Math.min(ball.speed + SPEED_RAMP * dt, MAX_SPEED);
  const mag = Math.hypot(ball.vx, ball.vy) || 1;
  ball.vx = ball.vx / mag * ball.speed;
  ball.vy = ball.vy / mag * ball.speed;

  // CHAOS: random heading flip on the expiring 0.1–3s timer
  if (config.ball === 'chaos') {
    ball.chaosTimer -= dt;
    if (ball.chaosTimer <= 0) {
      const a = Math.random() * Math.PI * 2;
      ball.vx = Math.cos(a) * ball.speed;
      ball.vy = Math.sin(a) * ball.speed;
      resetChaosTimer();
    }
  }

  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  if (ball.y < 0) { ball.y = 0; ball.vy = Math.abs(ball.vy); beep(300, 0.04); }
  if (ball.y + BALL_SIZE > H) { ball.y = H - BALL_SIZE; ball.vy = -Math.abs(ball.vy); beep(300, 0.04); }

  if (ball.vx < 0 && hitsPaddle(left))  bounceOffPaddle(left, true);
  if (ball.vx > 0 && hitsPaddle(right)) bounceOffPaddle(right, false);

  if (ball.x + BALL_SIZE < 0) score('right');
  else if (ball.x > W)        score('left');
}

// --- Blocky pixel scoreboard (5x7 bitmap, original-arcade style) ---
const FONT = {
  '0': ["01110","10001","10001","10001","10001","10001","01110"],
  '1': ["00100","01100","00100","00100","00100","00100","01110"],
  '2': ["01110","10001","00001","00010","00100","01000","11111"],
  '3': ["11110","00001","00001","01110","00001","00001","11110"],
  '4': ["00010","00110","01010","10010","11111","00010","00010"],
  '5': ["11111","10000","11110","00001","00001","10001","01110"],
  '6': ["00110","01000","10000","11110","10001","10001","01110"],
  '7': ["11111","00001","00010","00100","01000","01000","01000"],
  '8': ["01110","10001","10001","01110","10001","10001","01110"],
  '9': ["01110","10001","10001","01111","00001","00010","01100"]
};
function drawDigit(ch, x, y, px) {
  const rows = FONT[ch];
  const bleed = Math.ceil(px) + 1; // overlap so adjacent blocks join cleanly
  for (let r = 0; r < 7; r++) {
    for (let c = 0; c < 5; c++) {
      if (rows[r][c] === '1') {
        ctx.fillRect(Math.floor(x + c * px), Math.floor(y + r * px), bleed, bleed);
      }
    }
  }
}
function drawScore(num, centerX, topY) {
  const s = String(num);
  const px = (H * 0.16) / 7;          // 7 pixels tall
  const dw = 5 * px;                  // 5 pixels wide
  const gap = px * 1.8;               // space between digits
  const totalW = s.length * dw + (s.length - 1) * gap;
  let sx = centerX - totalW / 2;
  for (const ch of s) { drawDigit(ch, sx, topY, px); sx += dw + gap; }
}

// --- Render ---
function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#fff';
  // center net
  const dash = H * 0.03, gap = H * 0.022, nw = Math.max(4, PADDLE_W * 0.4);
  for (let y = gap; y < H; y += dash + gap) ctx.fillRect(W/2 - nw/2, y, nw, dash);

  // scores
  drawScore(left.score,  W/2 - W * 0.16, H * 0.07);
  drawScore(right.score, W/2 + W * 0.16, H * 0.07);

  // paddles + ball
  ctx.fillRect(left.x,  left.y,  PADDLE_W, PADDLE_H);
  ctx.fillRect(right.x, right.y, PADDLE_W, PADDLE_H);
  ctx.fillRect(ball.x,  ball.y,  BALL_SIZE, BALL_SIZE);

  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.round(H*0.06)}px "Courier New", monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('PAUSED', W/2, H/2);
  }
}

// --- Loop ---
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  if (state === 'playing' && !paused) { updatePaddles(dt); updateBall(dt); }
  if (state !== 'menu') draw();
  requestAnimationFrame(loop);
}

setupDimensions(true);
requestAnimationFrame(loop);
</script>
</body>
</html>
